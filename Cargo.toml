[package]
name = "quickedit"
version = "0.1.0"
edition = "2021"
description = "QuickEdit — a lightweight, cross-platform desktop video editor (rotate + crop, save in place)"
license = "MIT"

[[bin]]
name = "quickedit"
path = "src/main.rs"

[dependencies]
# GUI: immediate-mode, pure Rust, native on Linux / macOS / Windows.
eframe = { version = "0.29", default-features = true }
egui = { version = "0.29", default-features = true }
# Native folder picker.
rfd = "0.15"
# Load thumbnail / preview JPEG-PNG frames into egui images.
image = "0.25"
# Clear, composable error messages.
anyhow = "1"
thiserror = "2"
# Lightweight logging.
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = false